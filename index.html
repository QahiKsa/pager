<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تتبع الطلب</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#f1e6d0">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><style>
.modal{position:fixed;inset:0;background:rgba(58,42,28,.65);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.mc{background:var(--paper);color:var(--ink);border-radius:28px;padding:28px 24px;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.mc h2{margin:0;color:var(--brown);font-size:24px}.mc p{margin:0;color:var(--mute)}
.mc .bell{width:84px;height:84px;border-radius:50%;background:var(--brown);display:flex;align-items:center;justify-content:center}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.row2 .ghost{color:var(--brown)}
.rcup{position:relative;width:230px;height:230px;animation:shake .6s infinite;transform-origin:50% 90%}
.rcup svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;transition:opacity .9s ease}
.rcup.hot .c-hot,.rcup.ice .c-ice{opacity:1}
.steam path{fill:none;stroke:#f1e6d0;stroke-width:6;stroke-linecap:round;opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:steam 3.2s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1s}.steam path:nth-child(3){animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(14px) scaleX(.8)}30%{opacity:.85}100%{opacity:0;transform:translateY(-26px) scaleX(1.25)}}
.ice-cube{transform-box:fill-box;transform-origin:50% 50%;animation:bob 3s ease-in-out infinite}
.ice-cube:nth-of-type(2){animation-delay:-1s;animation-duration:3.6s}.ice-cube:nth-of-type(3){animation-delay:-2s;animation-duration:2.7s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-5px) rotate(7deg)}}
.wave{animation:wave 2.4s ease-in-out infinite alternate}@keyframes wave{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.drop{animation:drop 3.4s ease-in infinite;opacity:0}@keyframes drop{0%{opacity:0;transform:translateY(-8px)}15%{opacity:.9}60%{opacity:.9}100%{opacity:0;transform:translateY(16px)}}
.rn{font-family:'Reem Kufi',Tajawal,sans-serif;font-weight:700;fill:#f1e6d0}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@media(prefers-reduced-motion:reduce){.rcup,.steam path,.ice-cube,.wave,.drop{animation:none}.steam path{opacity:.6}}
.xo{display:grid;grid-template-columns:repeat(3,86px);gap:10px}
.xo button{width:86px;height:86px;min-width:0;min-height:0;padding:0;border-radius:20px;border:2px solid var(--line,#dccfb4);background:var(--paper,#fbf6ea);box-shadow:none;font:700 48px/1 'Reem Kufi',Tajawal,sans-serif;color:var(--brown,#934713);cursor:pointer}
.xo button.o{color:var(--olive,#586d54)}
.xo button.w{background:#f1e6d0;border-color:var(--brown,#934713)}
.xo button:disabled{cursor:default}</style></head><body>
<main class="scr" id="scr">
  <header class="chead"><img class="logo big" src="logo.png" alt="قاهي" onload="document.getElementById('bn').hidden=true" onerror="this.remove()"><div class="brand" id="bn"></div></header>
  <section class="mid" id="v-in">
    <div class="sub">تابع طلبك من جوالك</div>
    <input id="in" type="text" inputmode="numeric" autocomplete="off" placeholder="رقم الطلب" aria-label="رقم الطلب">
    <button class="cta" id="go">تتبع طلبي</button><div class="er" id="er"></div>
    <div class="sub">بنبلغك بصوت وتنبيه أول ما يجهز</div><div class="sub" id="ios" hidden>آيفون: اضغط مشاركة ثم «إضافة إلى الشاشة الرئيسية» وافتح الموقع من الأيقونة عشان توصلك التنبيهات</div>
  </section>
  <section class="mid" id="v-wait" hidden>
    <div class="sub">طلب رقم <b id="wn"></b></div>
    <div class="ring"><svg width="220" height="220"><circle cx="110" cy="110" r="100" fill="none" stroke="#dccfb4" stroke-width="10"/><circle id="arc" cx="110" cy="110" r="100" fill="none" stroke="#586d54" stroke-width="10" stroke-linecap="round"/></svg><div class="in"><div class="t" id="cd"></div><div class="sub">الوقت المتوقع</div></div></div>
    <div class="sub" id="ps"></div>
    <button class="cta" id="play">العب وأنت تنتظر</button>
    <div class="row2"><button class="ghost" id="another">تتبع طلب آخر</button><button class="ghost" id="cancel">إلغاء المتابعة</button></div>
  </section>
  <section class="mid" id="v-game" hidden><div style="font-size:24px;font-weight:700">اكس أو</div><div class="sub" id="gsc"></div><div class="xo" id="xo" dir="ltr"></div><div class="sub" id="gsc2"></div><button class="cta" id="again" hidden>العب مرة ثانية</button><button class="ghost" id="gb">رجوع</button></section>
  <section class="mid" id="v-ready" hidden>
    <div style="font-size:28px;font-weight:700">طلبك جاهز</div><div class="rcup hot" id="rc" role="img" aria-label="طلبك جاهز">
      <svg class="c-hot" viewBox="0 0 200 200">
        <g class="steam"><path d="M80 66q-12-13 0-26t0-26"/><path d="M104 66q-12-13 0-26t0-26"/><path d="M128 66q-12-13 0-26t0-26"/></g>
        <ellipse cx="100" cy="176" rx="76" ry="11" fill="#e6d8bb"/>
        <path d="M154 96h12q22 0 22 24t-22 24h-10" fill="none" stroke="#fbf6ea" stroke-width="11" stroke-linecap="round"/>
        <path d="M42 84h116v46q0 42-58 42t-58-42z" fill="#fbf6ea" stroke="#dccfb4" stroke-width="3"/>
        <path d="M50 102q2 36 18 50" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
        <ellipse cx="100" cy="84" rx="58" ry="11" fill="#fbf6ea" stroke="#dccfb4" stroke-width="3"/>
        <ellipse cx="100" cy="85" rx="50" ry="8" fill="#5a3319"/>
        <ellipse cx="88" cy="83" rx="18" ry="3" fill="#8a5a33" opacity=".7"/>
        <rect x="64" y="107" width="72" height="48" rx="14" fill="#934713"/>
        <text class="rn" id="rn1" x="100" y="141" text-anchor="middle" font-size="36"></text>
      </svg>
      <svg class="c-ice" viewBox="0 0 200 200">
        <defs><clipPath id="rcc"><path d="M56 56h88l-11 134q-1 10-11 10H78q-10 0-11-10z"/></clipPath>
          <linearGradient id="rlq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3c6a0"/><stop offset=".35" stop-color="#b88455"/><stop offset="1" stop-color="#5a3319"/></linearGradient></defs>
        <path d="M122 4l-14 112" stroke="#586d54" stroke-width="8" stroke-linecap="round"/>
        <path d="M118.6 30l-2 16M115 62l-2 16" stroke="#f1e6d0" stroke-width="8" stroke-linecap="round" opacity=".85"/>
        <path d="M56 56h88l-11 134q-1 10-11 10H78q-10 0-11-10z" fill="#fff" fill-opacity=".45"/>
        <g clip-path="url(#rcc)">
          <rect x="40" y="82" width="130" height="130" fill="url(#rlq)"/>
          <path class="wave" d="M30 84q15-9 30 0t30 0 30 0 30 0 30 0V96H30z" fill="#ecd3b0"/>
          <g class="ice-cube"><rect x="66" y="92" width="30" height="30" rx="7" fill="#fff" fill-opacity=".5" stroke="#fff" stroke-opacity=".9" stroke-width="2"/></g>
          <g class="ice-cube"><rect x="104" y="98" width="28" height="28" rx="7" fill="#fff" fill-opacity=".45" stroke="#fff" stroke-opacity=".9" stroke-width="2"/></g>
          <g class="ice-cube"><rect x="84" y="164" width="26" height="26" rx="7" fill="#fff" fill-opacity=".4" stroke="#fff" stroke-opacity=".9" stroke-width="2"/></g>
        </g>
        <path d="M56 56h88l-11 134q-1 10-11 10H78q-10 0-11-10z" fill="none" stroke="#cfc3a8" stroke-width="3"/>
        <rect x="50" y="48" width="100" height="11" rx="5.5" fill="#586d54"/>
        <rect x="66" y="112" width="68" height="48" rx="14" fill="#934713" stroke="#f1e6d0" stroke-width="2"/>
        <text class="rn" id="rn2" x="100" y="146" text-anchor="middle" font-size="36"></text>
        <circle class="drop" cx="150" cy="120" r="3.5" fill="#9bc6d6"/>
        <circle class="drop" cx="48" cy="150" r="3" fill="#9bc6d6" style="animation-delay:1.6s"/>
      </svg>
    </div><div>تفضل بالاستلام من الكاونتر</div>
    <button class="cta" style="background:#f1e6d0;color:#934713" id="got">استلمت طلبي</button>
  </section>
</main>
<div class="modal" id="silent" hidden><div class="mc"><div class="bell"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#f1e6d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
<h2>من فضلك شيل الصامت</h2><p>عشان ما يفوتك التنبيه لما يجهز طلبك</p><button class="cta" id="ok">حسناً</button></div></div>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,doc,getDoc,onSnapshot,updateDoc,arrayUnion} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getMessaging,getToken,isSupported} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js';
const PUSH_ENABLED=true; // غيّرها إلى true بعد ما تفعّل Blaze وتنشر الدالة
const $=i=>document.getElementById(i),C=2*Math.PI*100,BAD=/XXXX|YOUR-|0000000000/.test(JSON.stringify(FB.config));
let gt=null,bd=[],over=false,busy=false,sc={w:0,l:0,d:0},app,db,mine=null,state=null,unsub=null,ac=null,alarm=null,push=false;
$('arc').setAttribute('stroke-dasharray',C);
const fmt=s=>Math.floor(s/60)+':'+('0'+s%60).slice(-2),left=()=>Math.max(0,Math.ceil((state.eta-Date.now())/1000));
const norm=s=>s.replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).trim();
const T=p=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),8000))]);
const err=m=>$('er').textContent=m;
function setRn(n){n=String(n);const fs=n.length>4?18:n.length>3?24:n.length>2?30:36;['rn1','rn2'].forEach(id=>{$(id).textContent=n;$(id).setAttribute('font-size',fs)})}
let hotCup=true;setInterval(()=>{hotCup=!hotCup;$('rc').className='rcup '+(hotCup?'hot':'ice')},7000);
if(/iphone|ipad/i.test(navigator.userAgent)&&!(navigator.standalone||matchMedia('(display-mode: standalone)').matches))$('ios').hidden=false;
function show(v){const lg=document.querySelector('.chead .logo');if(lg)lg.src=v==='ready'?'logo-light.png':'logo.png';if(v!=='game'){clearTimeout(gt);busy=false}['in','wait','ready','game'].forEach(x=>$('v-'+x).hidden=x!==v);$('scr').className='scr'+(v==='ready'?' ready':'')}
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
addEventListener('pointerdown',unlock);
function chime(){if(!ac)return;[880,1175,1568].forEach((f,i)=>{const t=ac.currentTime+i*.22,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.65)})}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}};
function startAlarm(){if(alarm)return;chime();buzz();alarm=setInterval(()=>{chime();buzz()},2000)}
function stopAlarm(){clearInterval(alarm);alarm=null}
function tick(){if(state&&state.status==='preparing'){const l=left();$('cd').textContent=fmt(l);$('arc').setAttribute('stroke-dashoffset',C*(1-Math.min(1,l/state.total)))}}
setInterval(tick,1000);
$('bn').textContent='';
if(BAD){err('إعدادات Firebase ما انضبطت في ملف firebase-config.js')}
else{app=initializeApp(FB.config);db=getFirestore(app);
  onSnapshot(doc(db,'settings','main'),s=>{const n=s.exists()?s.data().name:'';$('bn').textContent=n;document.title=n||'تتبع الطلب'},()=>{});
  const p=new URLSearchParams(location.search).get('o')||localStorage.getItem('order');if(p)track(p)}
async function track(n){n=norm(n||$('in').value);if(!n)return;unlock();if(BAD)return;
  err('جاري البحث...');
  try{const s=await T(getDoc(doc(db,'orders',n)));if(!s.exists()||s.data().status==='picked'){err('رقم الطلب غير موجود، تأكد منه وحاول مرة ثانية');return}}
  catch(e){err(e.code==='permission-denied'?'ما عندك صلاحية، تأكد من نشر قواعد Firestore':'تعذر الاتصال، تأكد من الإنترنت وحاول مرة ثانية');return}
  err('');mine=n;localStorage.setItem('order',n);if(!sessionStorage.getItem('sil')){$('silent').hidden=false;sessionStorage.setItem('sil','1')}unsub&&unsub();
  unsub=onSnapshot(doc(db,'orders',n),x=>{state=x.exists()?x.data():null;
    if(!state||state.status==='picked'){leave();return}
    if(state.status==='ready'){startAlarm();setRn(mine);show('ready')}
    else{$('wn').textContent=mine;$('ps').textContent=push?'التنبيهات مفعّلة، تقدر تقفل الشاشة':'أبقِ هذي الصفحة مفتوحة ليشتغل الصوت والتنبيه';if($('v-game').hidden)show('wait');tick()}});
  if(PUSH_ENABLED)enablePush(n)}
function leave(){stopAlarm();unsub&&unsub();mine=null;state=null;localStorage.removeItem('order');$('in').value='';err('');show('in')}
async function enablePush(n){try{if(!(await isSupported()))throw 0;if(await Notification.requestPermission()!=='granted')throw 0;
  const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');
  const t=await getToken(getMessaging(app),{vapidKey:FB.vapidKey,serviceWorkerRegistration:reg});
  await updateDoc(doc(db,'orders',n),{tokens:arrayUnion(t)});push=true;$('ps').textContent='التنبيهات مفعّلة، تقدر تقفل الشاشة'}catch(e){push=false}}
$('go').onclick=()=>track();$('in').onkeydown=e=>{if(e.key==='Enter')track()};const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const winLine=b=>W.find(([x,y,z])=>b[x]&&b[x]===b[y]&&b[x]===b[z]);
function gRender(line){$('xo').innerHTML=bd.map((v,i)=>'<button data-i="'+i+'" class="'+(v==='O'?'o':'')+(line&&line.includes(i)?' w':'')+'" aria-label="خانة '+(i+1)+'"'+(v||over?' disabled':'')+'>'+v+'</button>').join('');
  $('gsc2').textContent='أنت '+sc.w+' · الكمبيوتر '+sc.l+' · تعادل '+sc.d}
function gNew(){clearTimeout(gt);bd=Array(9).fill('');over=false;busy=false;$('again').hidden=true;$('gsc').textContent='دورك (X)';gRender()}
function gEnd(){const l=winLine(bd);
  if(l){over=true;const me=bd[l[0]]==='X';me?sc.w++:sc.l++;$('gsc').textContent=me?'فزت! مبروك':'فاز الكمبيوتر، جرب مرة ثانية'}
  else if(bd.every(Boolean)){over=true;sc.d++;$('gsc').textContent='تعادل'}
  else return false;
  gRender(l);$('again').hidden=false;return true}
function gPick(){const e=bd.map((v,i)=>v?-1:i).filter(i=>i>=0),f=p=>e.find(i=>{bd[i]=p;const w=winLine(bd);bd[i]='';return w});
  const rnd=a=>a[Math.random()*a.length|0];
  if(Math.random()<.2)return rnd(e);
  let m=f('O');if(m!==undefined)return m;m=f('X');if(m!==undefined)return m;
  if(!bd[4])return 4;const c=e.filter(i=>[0,2,6,8].includes(i));return c.length?rnd(c):rnd(e)}
$('xo').onclick=e=>{const b=e.target.closest('button');if(!b||over||busy)return;const i=+b.dataset.i;if(bd[i])return;
  bd[i]='X';gRender();if(gEnd())return;busy=true;$('gsc').textContent='الكمبيوتر يفكر...';
  gt=setTimeout(()=>{bd[gPick()]='O';busy=false;gRender();if(!gEnd())$('gsc').textContent='دورك (X)'},500)};
$('again').onclick=gNew;
$('play').onclick=()=>{gNew();show('game')};
$('gb').onclick=()=>show(state&&state.status==='ready'?'ready':'wait');
$('got').onclick=leave;$('another').onclick=leave;$('cancel').onclick=leave;$('ok').onclick=()=>{$('silent').hidden=true;unlock()};
show('in');
</script></body></html>
